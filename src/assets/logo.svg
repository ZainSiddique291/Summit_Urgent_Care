<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 245 58" width="245" height="58" role="img" aria-label="Summit Urgent Care Logo">
  <defs>
    <linearGradient id="crossRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E03131" />
      <stop offset="100%" stop-color="#C91D1D" />
    </linearGradient>
    <linearGradient id="crossNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143A73" />
      <stop offset="100%" stop-color="#0B2247" />
    </linearGradient>
  </defs>

  <!-- Medical Cross Emblem: split dual-tone red + navy with peak/summit accent and ECG pulse -->
  <g transform="translate(4, 5)">
    <!-- Navy right/bottom cross silhouette -->
    <path
      d="M17 2 C17 0.9 17.9 0 19 0 H29 C30.1 0 31 0.9 31 2 V17 H46 C47.1 17 48 17.9 48 19 V29 C48 30.1 47.1 31 46 31 H31 V46 C31 47.1 30.1 48 29 48 H19 C17.9 48 17 47.1 17 46 V31 H2 C0.9 31 0 30.1 0 29 V19 C0 17.9 0.9 17 2 17 H17 Z"
      fill="url(#crossNavyGrad)"
    />
    <!-- Medical Red left/upper overlapping cross portion -->
    <path
      d="M17 2 C17 0.9 17.9 0 19 0 H24 V48 H19 C17.9 48 17 47.1 17 46 V31 H2 C0.9 31 0 30.1 0 29 V19 C0 17.9 0.9 17 2 17 H17 Z"
      fill="url(#crossRedGrad)"
    />
    <!-- Subtle inner highlight ridge -->
    <path
      d="M24 0 H29 C30.1 0 31 0.9 31 2 V17 H46 C47.1 17 48 17.9 48 19 V24 H24 Z"
      fill="#1A4585"
      opacity="0.45"
    />
    <!-- Crisp white heartbeat / summit peak ECG line -->
    <path
      d="M4 24.5 H14 L17.5 17.5 L21.5 32.5 L26.5 13 L30.5 28 L33.5 24.5 H44"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Brand Wordmark -->
  <text
    x="62"
    y="26"
    font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', Arial, sans-serif"
    font-size="22"
    font-weight="800"
    letter-spacing="-0.4"
    fill="#0C2348"
  >Summit</text>
  <text
    x="62"
    y="47"
    font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', Arial, sans-serif"
    font-size="18.5"
    font-weight="700"
    letter-spacing="-0.2"
    fill="#D62828"
  >Urgent Care</text>
</svg>

